[pytest]
DJANGO_SETTINGS_MODULE = plane.settings.test_local
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for models, serializers, and utility functions
    contract: Contract tests for API endpoints
    smoke: Smoke tests for critical functionality
    slow: Tests that are slow and might be skipped in some contexts
    qa: QA University tests proyect
    rafael: Tests assigned to Rafael Odio
    daniel: Tests assigned to Daniel Salas
    jairo: Tests assigned to Jairo Gonzalez
    fabian: Tests related to Fabian's work

addopts =
    --strict-markers
    --nomigrations
    -n auto
    -vs 
